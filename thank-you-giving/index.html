<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you for giving monthly | Faith Driven Singapore</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://faithdriven.sg/thank-you-giving/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4MDEPHJHBF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-4MDEPHJHBF');
/* Stripe Payment Links for the monthly tiers redirect here after payment. In each link set
   "After payment > Redirect customers to your website":
   https://faithdriven.sg/thank-you-giving/?a=<10|30|50|100>&session_id={CHECKOUT_SESSION_ID}
   Fires the primary GA4 key event recurring_donation_complete once per checkout session. */
(function(){
  var q=new URLSearchParams(location.search), sid=q.get('session_id')||'', k='fde_done_'+(sid||'nosid');
  try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); }catch(e){}
  var a=+(q.get('a')||0); if(!a){ try{ a=+(localStorage.getItem('fde_gift')||0); }catch(e){} }
  var p={transaction_id: sid||('fde-'+Date.now()), currency:'SGD', frequency:'monthly'};
  if(a){ p.value=a; p.amount=a; }
  gtag('event','recurring_donation_complete',p);
})();</script>
</head><body class="s-dark">
<main class="section s-dark"><div class="container" style="max-width:46rem;padding:6rem 0">
  <span class="eyebrow">Thank you</span>
  <h1 class="display">You're now a monthly <em>partner</em>.</h1>
  <p class="body-lg muted">Thank you for standing with Singapore's Faith Driven Entrepreneur community. Stripe has emailed your receipt, and you can change or cancel your gift at any time from the link in that email.</p>
  <p style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap">
    <a class="btn btn-primary btn-lg" href="/gatherings/">See upcoming gatherings</a>
    <a class="btn btn-lg" href="/">Back to home</a>
  </p>
</div></main>
<script src="/track.js" defer></script>
</body></html>
